services:
  postgres:
    image: postgres:17
    container_name: postoffice-shipment-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: PostOfficeShipmentDb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d PostOfficeShipmentDb"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: src/PostOfficeShipment.Api/Dockerfile

    container_name: postoffice-shipment-api
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__ShipmentDb: "Host=postgres;Port=5432;Database=PostOfficeShipmentDb;Username=postgres;Password=postgres"

    ports:
      - "8080:8080"

volumes:
  postgres_data:
